<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Styling & JavaScript Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Advanced Styling and JavaScript</h1>
  </header>

  <section class="responsive-demo">
    <h2>Responsive Design Example</h2>
    <p>Resize the browser to see the layout change!</p>
    <div class="cards">
      <div class="card">Card 1</div>
      <div class="card">Card 2</div>
      <div class="card">Card 3</div>
    </div>
  </section>

  <section class="quiz-section">
    <h2>Interactive Quiz</h2>
    <div id="quiz-container">
      <p id="question"></p>
      <div id="answers"></div>
      <button id="next-btn">Next</button>
      <p id="score"></p>
    </div>
  </section>

  <section class="carousel-section">
    <h2>Image Carousel</h2>
    <div class="carousel">
      <img src="https://picsum.photos/id/1018/600/300" class="carousel-img active">
      <img src="https://picsum.photos/id/1015/600/300" class="carousel-img">
      <img src="https://picsum.photos/id/1019/600/300" class="carousel-img">
      <button class="prev">&lt;</button>
      <button class="next">&gt;</button>
    </div>
  </section>

  <section class="api-section">
    <h2>Fetch Data from API</h2>
    <button id="fetch-btn">Get Random Joke</button>
    <p id="joke"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
